<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#11151d" />
    <title>Survivors ECS example</title>
    <link rel="canonical" href="https://survivors.dearlordylord.com/" />
    <meta name="description" content="A Vampire Survivors clone built as a Bendvy ECS example." />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./menu-a.css" />

  <body>
    <main id="app">
      <canvas
        id="game"
        width="1024"
        height="640"
        aria-label="Nightfall Survivors game field"
        tabindex="0"
      ></canvas>
      <div id="hud" hidden>
        <div class="topline">
          <span class="brand">Nightfall Survivors</span
          ><span id="clock">00:00</span><span id="gold"></span
          ><button id="map" aria-label="Open arena map">Map [M]</button><button id="pause" aria-label="Pause">Ⅱ</button>
        </div>
        <div class="xp"><i id="xpFill"></i><span id="level"></span></div>
        <div class="health">
          <i id="hpFill"></i><span id="healthText"></span>
        </div>
        <div id="loadout"></div>
        <div id="runStats"></div>
      </div>
      <section id="menu" class="screen">
        <div id="menuScroll">
        <div class="menu-wrap">
          <header class="menu-header">
            <div class="menu-brand"><span class="brand-mark" aria-hidden="true">✦</span><div><strong>Survivors</strong><small>Bendvy ECS example</small></div></div>

          <noscript><p class="script-notice">Playing requires JavaScript. The catalog is readable below.</p><style>.inline-picker[hidden]{display:block!important}</style></noscript>
          <div id="wallet"></div>
          <p id="engineStatus" role="status" aria-live="polite"></p>
          <div id="menuContent"></div>
          <footer>
            WASD / arrow keys to move · M for map · Esc / Space to pause · attacks are
            automatic<br />Experience unlocks abilities. Chests awaken
            evolutions.
          </footer>


        </div>
        </div>
        <div id="menuDock" class="expedition" hidden></div>
      </section>
      <section id="overlay" class="screen" hidden>
        <div
          id="dialog"
          class="dialog banner-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
          tabindex="-1"
        ></div>
      </section>
      <div id="toast" role="status"></div>
      <div id="joystick" hidden><div id="stick"></div></div>
      <div id="error" hidden role="alert"></div>
    </main>
    <script type="module" src="./browser.mjs"></script>
</body>
</html>
